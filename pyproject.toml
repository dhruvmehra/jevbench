[project]
name = "jevbench"
version = "0.1.0"
description = "Benchmark TypeSafe JEV against LLMs and BERT on text classification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "datasets>=3.0",
  "transformers>=4.45",
  "torch>=2.4",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "laya>=0.3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jevbench = "jevbench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
